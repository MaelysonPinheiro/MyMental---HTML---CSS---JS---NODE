<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyMentalWellness</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Login</h2>
            <form action="/login" method="POST"> <!-- A ação será direcionada ao backend -->
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Entrar</button>
                <p class="signup-link">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
            </form>
        </div>
    </div>
</body>
</html>
