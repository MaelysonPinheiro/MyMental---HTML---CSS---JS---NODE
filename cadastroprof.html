<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Profissionais - MyMentalWellness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auto.css">
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <div id="header-auto-gestao-section">
        <nav class="nav-auto-gestao">
            <a class="brand-auto-gestao" href="index.html">MyMentalWellness</a>
            <ul class="menu-auto-gestao">
                <li><a href="auto.html">Auto-Gestão</a></li>
                <li><a href="forum.html">Fórum</a></li>
                <li><a href="grupo.html">Grupos de Discussão</a></li>
                <li id="user-menu">
                    <button id="user-button">Carregando...</button>
                    <div id="user-dropdown" class="dropdown-content">
                        <a href="config.html">Configurações</a>
                        <a href="index.html" id="logout-link">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </div>

    <main class="register-professional-container">
        <h2>Cadastro de Profissional</h2>
        <form id="register-professional" method="POST" action="/api/professionals/register" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Nome" required>
            <input type="text" name="specialty" placeholder="Especialidade" required>
            <input type="text" name="location" placeholder="Localização (se online colocar 'ONLINE')" required>
            <input type="text" name="price_range" placeholder="Faixa de Preço">
            <textarea name="bio" placeholder="Breve biografia com dados para contato"></textarea>
            
            <label for="profile_picture">Foto de Perfil</label>
            <input type="file" name="profile_picture" id="profile_picture" accept="image/*" required>
        
            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <div class="back-to-top" id="backToTopButton">
        <a href="auto.html" title="Voltar à Auto-Gestão">⬆️</a>
    </div>

    <div class="floating-button">
        <a href="ajuda.html">Preciso de Ajuda!</a>
    </div>

    <footer id="footer-auto-gestao-section">
        <p>&copy; 2026 MyMentalWellness. Todos os direitos reservados.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
