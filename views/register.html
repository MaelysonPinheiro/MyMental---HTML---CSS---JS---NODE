<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MyMentalWellness</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <div class="register-wrapper">
        <div class="register-box">
            <h2>Registrar</h2>
            <form action="/register" method="POST"> <!-- A ação será direcionada ao backend -->
                <div class="input-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirme a Senha</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required>
                </div>
                <button type="submit" class="register-btn">Registrar</button>
                <p class="login-link">Já tem uma conta? <a href="login.html">Faça Login</a></p>
            </form>
        </div>
    </div>
</body>
</html>
