<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MyMentalWellness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auto.css"> 
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <header class="index-header">
        <div class="index-nav">
            <a href="index.html" class="index-brand">
                <img src="/img/icone mental.png" alt="Logo MyMentalWellness">
                <span>MyMentalWellness</span>
            </a>
        </div>
    </header>

    <main class="register-wrapper">
        <div class="register-box">
            <h2>Criar Conta</h2>
            <form action="/register" method="POST">
                <div class="input-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" name="username" required placeholder="Seu nome completo">
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Crie uma senha forte">
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirme a Senha</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required placeholder="Digite a senha novamente">
                </div>
                <button type="submit" class="register-btn">Registrar</button>
                <p class="login-link">Já tem uma conta? <a href="login.html">Faça Login</a></p>
            </form>
        </div>
    </main>

    <footer id="footer-auto-gestao-section">
        <p>&copy; 2026 MyMentalWellness. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
