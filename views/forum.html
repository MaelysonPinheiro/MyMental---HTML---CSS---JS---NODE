<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum - MyMentalWellness</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <div id="header-auto-gestao-section">
        <nav class="nav-auto-gestao">
            <ul class="menu-auto-gestao">
                <li><a href="auto.html">Auto-Gestão</a></li>
                <li><a href="forum.html" class="active-auto-gestao">Fórum</a></li>
                <li><a href="grupo.html" >Grupos de Discussão</a></li>
                <li id="user-menu">
                    <button id="user-button">Carregando...</button>
                    <div id="user-dropdown" class="dropdown-content">
                        <a href="config.html">Configurações</a>
                        <a href="index.html" id="logout-link">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </div>

    <form id="post-form" enctype="multipart/form-data" method="POST" action="/posts">
        <textarea id="post-content" name="message" placeholder="Escreva algo..."></textarea>
        <div id="image-upload-container">
            <input type="file" id="image-upload" name="image" accept="image/*">
            <label for="image-upload" class="image-upload-button">
                📷
            </label>
        </div>
        <button type="submit" id="post-button">Postar</button>
    </form>
    
    
    <div id="posts" class="posts-container">
        <!-- Os posts serão carregados aqui -->
    </div>

    <div class="floating-button">
        <a href="ajuda.html">Preciso de Ajuda!</a>
    </div>

    <footer id="footer-auto-gestao-section">
        <p>&copy; 2024 MyMentalWellness. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
    fetch('/username')
        .then(response => response.json())
        .then(data => {
            document.getElementById('user-button').textContent = `Olá, ${data.username}`;
        })
        .catch(error => {
            console.error('Erro ao carregar o nome do usuário:', error);
            document.getElementById('user-button').textContent = 'Erro ao carregar nome';
        });

    document.getElementById('user-button').addEventListener('click', () => {
        const userMenu = document.getElementById('user-menu');
        userMenu.classList.toggle('show');
    });

    document.getElementById('logout-link').addEventListener('click', (event) => {
        event.preventDefault();
        fetch('/logout')
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                }
            })
            .catch(error => {
                console.error('Erro ao fazer logout:', error);
            });
    });

    window.addEventListener('click', (event) => {
        const userMenu = document.getElementById('user-menu');
        if (!userMenu.contains(event.target) && userMenu.classList.contains('show')) {
            userMenu.classList.remove('show');
        }
    });
});
document.addEventListener('DOMContentLoaded', function() {
    const topicForm = document.getElementById('post-form');
    const topicTitle = document.getElementById('post-content'); // Aqui está o erro. Devemos pegar o conteúdo do post corretamente.
    const topicContent = document.getElementById('post-content'); // Atualize para capturar o campo correto (se necessário).
    const postsContainer = document.getElementById('posts');

    // Carregar tópicos
    async function loadPosts() {
        postsContainer.innerHTML = '<p>Carregando posts...</p>';

        try {
            const response = await fetch('/api/posts');
            const posts = await response.json();

            postsContainer.innerHTML = '';

            if (posts.length === 0) {
                postsContainer.innerHTML = '<p>Nenhum post encontrado!</p>';
                return;
            }

            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post';

                const formattedDate = new Date(post.data_postagem).toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                postElement.innerHTML = `
                    <h3>Post de Usuário ${post.user_id} em ${formattedDate}</h3>
                    <p>${post.conteudo || "Sem conteúdo"}</p>
                    ${post.foto_url ? `<img src="${post.foto_url}" alt="Imagem do post" />` : ''}
                `;

                postsContainer.appendChild(postElement);
            });

            postsContainer.scrollTop = postsContainer.scrollHeight; // Mantém no final
        } catch (error) {
            console.error('Erro ao carregar os posts:', error);
            postsContainer.innerHTML = '<p>Erro ao carregar os posts.</p>';
        }
    }

    // Enviar novo tópico
    topicForm.addEventListener('submit', async function(event) {
        event.preventDefault();

        const title = topicTitle.value.trim(); // Certifique-se de que está pegando o valor correto
        const content = topicContent.value.trim(); // Aqui está o conteúdo do post.

        if (!title || !content) {
            alert('Por favor, preencha todos os campos.');
            return;
        }

        try {
            const response = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });

            const result = await response.json();

            if (result.success) {
                topicTitle.value = '';
                topicContent.value = ''; // Limpa os campos depois de enviar
                await loadPosts(); // Atualiza os posts
            } else {
                alert('Erro ao criar tópico: ' + (result.message || 'Erro desconhecido'));
            }
        } catch (error) {
            console.error('Erro ao enviar tópico:', error);
            alert('Erro ao enviar tópico. Tente novamente mais tarde.');
        }
    });

    // Carrega os posts ao carregar a página
    loadPosts();
});



    </script>
</body>
</html>
