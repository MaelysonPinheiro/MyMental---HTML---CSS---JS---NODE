<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos de Discussão - MyMentalWellness</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="shortcut icon" href="/img/icone mental.png" type="image/x-icon">
</head>
<body>
    <div id="header-auto-gestao-section">
        <nav class="nav-auto-gestao">
            <ul class="menu-auto-gestao">
                <li><a href="auto.html">Auto-Gestão</a></li>
                <li><a href="forum.html">Fórum</a></li>
                <li><a href="grupo.html" class="active-auto-gestao">Grupos de Discussão</a></li>
                <li id="user-menu">
                    <button id="user-button">Carregando...</button>
                    <div id="user-dropdown" class="dropdown-content">
                        <a href="config.html">Configurações</a>
                        <a href="index.html" id="logout-link">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Mensagens serão carregadas aqui -->
        </div>
        <div class="chat-input">
            <input type="file" id="image-upload" accept="image/*" style="display:none;">
            <label for="image-upload" class="emoji-button">📷</label>
            <textarea id="message-input" placeholder="Digite uma mensagem..."></textarea>
            <button id="send-button">Enviar</button>
        </div>
    </div>      

    <div class="floating-button">
        <a href="ajuda.html">Preciso de Ajuda!</a>
    </div>

    <footer id="footer-auto-gestao-section">
            <p>&copy; 2024 MyMentalWellness. Todos os direitos reservados.</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
    fetch('/username')
        .then(response => response.json())
        .then(data => {
            document.getElementById('user-button').textContent = `Olá, ${data.username}`;
        })
        .catch(error => {
            console.error('Erro ao carregar o nome do usuário:', error);
            document.getElementById('user-button').textContent = 'Erro ao carregar nome';
        });

    document.getElementById('user-button').addEventListener('click', () => {
        const userMenu = document.getElementById('user-menu');
        userMenu.classList.toggle('show');
    });

    document.getElementById('logout-link').addEventListener('click', (event) => {
        event.preventDefault();
        fetch('/logout')
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                }
            })
            .catch(error => {
                console.error('Erro ao fazer logout:', error);
            });
    });

    window.addEventListener('click', (event) => {
        const userMenu = document.getElementById('user-menu');
        if (!userMenu.contains(event.target) && userMenu.classList.contains('show')) {
            userMenu.classList.remove('show');
        }
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const chatMessages = document.getElementById('chat-messages');
    const imageUpload = document.getElementById('image-upload');

    // Função para carregar mensagens do banco de dados
    function loadMessages() {
    fetch('/api/chat')
        .then(response => response.json())
        .then(data => {
            const messages = data.messages;  // Aqui estamos acessando a chave "messages"
            chatMessages.innerHTML = ''; // Limpar mensagens anteriores
            messages.forEach(message => {
                const newMessage = document.createElement('div');
                newMessage.classList.add('message');

                // Hora da mensagem
                const messageTime = new Date(message.sent_at);
                const formattedTime = messageTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Se houver uma imagem
                if (message.image_url) {
                    const imageElement = document.createElement('img');
                    imageElement.src = message.image_url;
                    newMessage.appendChild(imageElement);
                }

                // Se houver texto
                if (message.message) {
                    const textElement = document.createElement('p');
                    textElement.textContent = message.message;
                    newMessage.appendChild(textElement);
                }

                // Exibir hora da mensagem no cantinho
                const timeElement = document.createElement('span');
                timeElement.classList.add('message-time');
                timeElement.textContent = formattedTime;
                newMessage.appendChild(timeElement);

                // Adicionar a mensagem no chat
                chatMessages.appendChild(newMessage);
            });

            // Rolagem automática para o final
            chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(error => console.error('Erro ao carregar mensagens:', error));
}

    // Chama a função para carregar as mensagens ao carregar a página
    loadMessages();

    // Enviar nova mensagem
    sendButton.addEventListener('click', function() {
        const messageText = messageInput.value.trim();
        const imageFile = imageUpload.files[0];

        if (messageText || imageFile) {
            // Enviar a mensagem para o banco de dados
            const formData = new FormData();
            formData.append('message', messageText);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            // Enviar a requisição para o servidor
            fetch('/api/chat', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.timestamp) {
                    // Criar a mensagem na tela
                    const newMessage = document.createElement('div');
                    newMessage.classList.add('message');

                    // Hora da mensagem
                    const messageTime = new Date(data.timestamp);
                    const formattedTime = messageTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    // Se houver uma imagem
                    if (imageFile) {
                        const imageElement = document.createElement('img');
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            imageElement.src = e.target.result;
                            newMessage.appendChild(imageElement);
                        };
                        reader.readAsDataURL(imageFile);
                    }

                    // Se houver texto
                    if (messageText) {
                        const textElement = document.createElement('p');
                        textElement.textContent = messageText;
                        newMessage.appendChild(textElement);
                    }

                    // Exibir hora da mensagem
                    const timeElement = document.createElement('span');
                    timeElement.classList.add('message-time');
                    timeElement.textContent = formattedTime;
                    newMessage.appendChild(timeElement);

                    // Adicionar a nova mensagem na tela
                    chatMessages.appendChild(newMessage);

                    // Rolagem automática para o final
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    // Limpar os campos de entrada
                    messageInput.value = '';
                    imageUpload.value = '';
                } else {
                    console.error('Erro ao enviar mensagem: resposta sem timestamp');
                }
            })
            .catch(error => console.error('Erro ao enviar mensagem:', error));
        }
    });
});

    </script>
</body>
</html>
